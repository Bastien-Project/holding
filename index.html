<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Webastien Holding</title>
    <style>
        body {
            height: 100%;
            width: 100%;
            font-family: sans-serif;
            background-color: #333;
            color: orange;
            margin: 0;
            padding: 0;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            padding: 1em;
            text-align: center;
            font-size: 1.5em;
        }

        .grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            position: relative;
        }

        .cell {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            text-decoration: none;
            color: orange;
            border: 1px solid white;
            transition: all 0.5s ease;
        }

        /* Quand une cellule est survolée, on cible toutes les autres */
        .cell:hover {
            transform: scale(1.2);
            background-color: #BABABA;
            color: purple;
        }

        /* On applique le flou à toutes les autres cellules sauf celle survolée */
        .grid:hover .cell:not(:hover) {
            filter: blur(2px);
            opacity: 0.7;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>Liste des sites imaginés, créés et façonnés par Bastien</header>
        <div class="grid">
            <a href="http://chatcpt.totalh.net" class="cell">ChatCPT</a>
            <a href="http://procrastinator.loveslife.biz/" class="cell">Procrastiantor</a>
            <a href="http://generator.likesyou.org" class="cell">Generator</a>
            <a href="https://elapsed-time.a0001.net/" class="cell">Birthday Calculator</a>
            <a href="http://cv-bastien-thomas.my-board.org" class="cell">Mon CV en ligne</a>
            <a href="page.html" class="cell">Projet "Apparté"</a>
            <a href="page.html" class="cell">Projet "Hello World"</a>
            <a href="page.html" class="cell">Projet "Site vitrine artisan"</a>
            <a href="page.html" class="cell">Projet "Ça fonctionne encore"</a>
        </div>
    </div>
</body>

</html>
